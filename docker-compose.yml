# 配置统一以仓库根目录 .env 为准：compose 自动用它做变量插值，并通过 env_file 注入容器。
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # 容器内监听地址固定，宿主机暴露端口由 .env 的 BACKEND_PORT 决定
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8000"
      # 数据文件落在挂载卷里，容器重建不丢
      DATA_FILE: /srv/app/data/store.json
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/data:/srv/app/data
  frontend:
    build: ./frontend
    env_file: .env
    environment:
      FRONTEND_HOST: 0.0.0.0
      FRONTEND_PORT: "5173"
      # 容器网络里通过服务名访问后端
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
